name: Pipeline Main da produção

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Gerar Artefato ZIP
        run: zip -r pipeline-demo.zip . -x "node_modules/*" ".git/*"

      - name: Publicar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: codigo-buildado
          path: pipeline-demo.zip

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Baixar Artefato
        uses: actions/download-artifact@v4
        with:
          name: codigo-buildado

      - name: Extrair Artefato
        run: unzip pipeline-demo.zip

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Simular deploy
        run: echo "Deploy realizado com sucesso"